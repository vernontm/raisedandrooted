<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in! | Raised &amp; Rooted Academy</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="optin-body">

  <div class="ty-wrap">
    <div class="ty-head">
      <div class="ty-emoji">🌱</div>
      <h1 id="tyHeading">You're in!</h1>
      <p>Here's your guide, <strong>The Real Numbers Behind Your Child's Future</strong>. Read it right here, or download it to keep.</p>
      <div class="ty-actions">
        <a class="btn btn-primary btn-lg" href="assets/raised-and-rooted-free-guide.pdf" id="downloadLink" download>Download the Guide (PDF)</a>
        <a class="btn btn-ghost btn-lg" href="/">← Back to Raised &amp; Rooted</a>
      </div>
    </div>

    <iframe class="pdf-frame" src="assets/raised-and-rooted-free-guide.pdf#view=FitH" title="The Real Numbers Behind Your Child's Future"></iframe>

    <p style="text-align:center; margin-top:24px; color:var(--muted); font-size:0.95rem;">
      Curious whether your child is a fit? <a href="/free-guide.html" style="color:var(--terracotta-deep); font-weight:700;">Reach out</a>, we'd love to talk about your child specifically.
    </p>
  </div>

  <script>
    // Personalize the greeting if we captured a name
    try {
      var name = localStorage.getItem('rr_lead_name');
      if (name && name !== 'null' && name !== 'undefined' && name.trim()) {
        document.getElementById('tyHeading').textContent = "You're in, " + name.trim() + "!";
      }
    } catch (e) {}
  </script>
</body>
</html>
